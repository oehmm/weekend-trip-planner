<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekend Trip Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:   #F5F2EB;
      --paper2:  #EEE9E0;
      --ink:     #1A1A1A;
      --muted:   #9ca3af;
      --border:  #d1cdc5;
      --accent:  #B95D4B;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--ink);
      padding: 20px 32px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: baseline; gap: 16px; }
    .header-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .header-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.6rem;
      line-height: 1;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    
    /* Logout-Button Styling */
    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 4px 10px;
      font-size: 0.65rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:hover {
      border-color: var(--ink);
      background: var(--paper2);
    }

    /* ── LAYOUT ── */
    .layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 61px); }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

    /* ── SIDEBAR ── */
    .sidebar {
      border-right: 1px solid var(--ink);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .section-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* Slider */
    .slider-field { margin-bottom: 18px; }
    .slider-field label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .slider-field label strong { font-weight: 700; }
    input[type=range] {
      appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 2px;
      background: var(--border);
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--ink);
      cursor: pointer;
      margin-top: -5px;
    }
    .range-minmax {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Select */
    .select-field { margin-bottom: 18px; }
    .select-field label { display: block; font-size: 0.8rem; margin-bottom: 6px; }
    select, input[type=text] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      outline: none;
      padding: 6px 0;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.2s;
      appearance: none;
    }
    select:focus, input[type=text]:focus { border-bottom-color: var(--ink); }

    /* Pill toggles */
    .pill-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .pill {
      padding: 5px 12px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .pill:hover:not(.active) { border-color: var(--ink); }

    /* Stars */
    .stars-group { display: flex; gap: 4px; margin-top: 4px; }
    .star-btn {
      width: 28px; height: 28px;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      color: var(--muted);
    }
    .star-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    /* Run button */
    .run-btn {
      width: 100%;
      padding: 12px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: auto;
    }
    .run-btn:hover { background: #333; }
    .run-btn:disabled { background: var(--border); cursor: not-allowed; }

    /* ── MAIN ── */
    .main { padding: 28px 32px; }

    /* Weekend tabs */
    .tabs-row {
      display: flex;
      border-bottom: 1px solid var(--ink);
      margin-bottom: 28px;
    }
    .wk-tab {
      padding: 10px 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text
